# GitLab CI configuration for forks deployed on GitLab Pages.
# Mirrors .github/workflows/build-and-deploy.yml: the generated data files are
# gitignored, so CI regenerates them before publishing.
#
# GitLab Pages serves whatever lands in `public/`, so the job runs build.py and
# then copies docs/ across. The image ships Python *and* git: build.py shells out
# to git to read the concept set versions that projects pin, and exits with an
# explicit error if git is missing.
#
# To use:
#   1. In your GitLab repo, go to Settings -> Pages (it is enabled by default).
#   2. Push to the default branch — the `pages` job runs on every push.
#   3. The site is served at the URL shown under Settings -> Pages. On gitlab.com
#      that is https://<group>.gitlab.io/<project>/, but self-hosted instances
#      differ (Framagit, for one, generates a per-project subdomain), so read the
#      URL from the settings page rather than assuming it.
#
# GIT_DEPTH: 0 fetches the full history. GitLab clones shallowly by default, and
# `git show <old-sha>:concept_sets/{id}.json` fails on a commit the clone never
# fetched — so a project pinning a past version would publish without it, and
# build.py only warns. Full history costs a few seconds and avoids that.

pages:
  stage: deploy
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - python3 build.py
    - mkdir -p public
    - cp -r docs/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
